[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chimera_agent_baseline"
version = "0.1.0"
description = "The Baseline Agent for the CHIMERA-Agent challenge"
readme = "README.md"
#requires-python = ">=3.12"
# Python 3.11 matches the CUDA 12.6 Grand Challenge base image.
requires-python = ">=3.11"         
authors = [{ name = "Sander Moonemans" }]
dependencies = [
    "langgraph>=1.1,<2",
    "langchain>=1.2,<2",
    "langchain-openai>=1.1,<2",
    "langchain-mcp-adapters>=0.2,<0.3",
    "mcp>=1.27,<2",
    "chromadb>=1.5,<2",
    "hydra-core>=1.3,<2",
    "python-dotenv>=1.2,<2",
    "jinja2>=3.1,<4",
    "pymupdf>=1.27,<2",
    "sentence-transformers>=5.4,<6",
    "rank_bm25>=0.2,<1",
    "pydantic>=2.10,<3",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "debugpy",
    "ipython",
]
# In-process vLLM backend for local GPU runs (provider=vllm). Heavy (pulls
# CUDA PyTorch), Linux + supported-Python only — install on a GPU box with
# `make install-vllm`. The Docker image gets vLLM from its base image instead.
# Pinned to match the container's base image (vllm/vllm-openai).
vllm = [
    "vllm==0.23.0",
]

[tool.hatch.build]
packages = ["src/chimera_agent_baseline"]

[tool.hatch.build.targets.wheel]
packages = ["src/chimera_agent_baseline"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
